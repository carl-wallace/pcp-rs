[package]
name = "pcp-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# ASN.1 encoding/decoding and related support from RustCrypto community
cms = { version = "0.3.0-pre.2", features = ["builder"] }
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.0", features = ["alloc", "derive", "oid", "pem"] }
pem-rfc7468 = "1.0.0"
pkcs5 = "0.8.1"
pkcs8 = { version = "0.11.0", features = ["encryption"] }
pkcs12 = { version = "0.2.0-pre.0", features = ["kdf"] }
spki = "0.8.0"
x509-cert = { version = "0.3.0", features = ["hazmat", "builder"] }

pkcs12_builder = { git="https://github.com/carl-wallace/pkcs12_builder.git"}
pqckeys = { git = "https://github.com/carl-wallace/pqckeys", branch = "main" }

# cryptography-related crates
aes = { version = "0.9.1" }
aes-gcm = { version = "0.11.0" , features = ["arrayvec"]}
aes-kw ="0.3.1"
cbc = { version = "0.2.1" }
cipher = { version = "0.5.0", features = ["alloc", "block-padding", "rand_core"] }
crypto-common = "0.2.0"
ecdsa = {version = "0.17.0", default-features = false, features = ["der", "pkcs8"]}
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize", "pkcs8", "rand_core"] }
ed448-goldilocks = {version = "0.14.0-pre.15", default-features = false}
elliptic-curve = {version = "0.14.1", default-features = false, features = ["sec1", "pkcs8"]}
hkdf = "0.13.0"
hmac = "0.13.0"
kem = { version = "0.3.0", features = ["getrandom"] }
ml-dsa = "0.1.1"
ml-kem = { version = "0.3.2" }
p256 = {version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"]}
p384 = {version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"]}
p521 = {version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"]}
rsa = { version = "0.10.0-rc.19", features = ["sha2"] }
sha2 = "0.11.0"
sha3 = "0.11.0"
signature = { version = "3.0.0", features = ["digest", "alloc"]}
slh-dsa = "0.2.0-rc.5"
tari-tiny-keccak = { version = "2.0.2", features = ["kmac"] }

# utility crates
chrono = "0.4.44"
clap = { version = "4.5.60", features = ["derive"] }
colored = "3.1.1"
hex-literal = "1.1.0"
lazy_static = "1.5.0"
rand = "0.10.0"
rand_core = { version = "0.10.0"}
subtle-encoding = "0.5.1"
walkdir = "2.5.0"
zerocopy = "0.8.39"

# async support
tokio = { version = "1.49.0", features = ["full", "time", "rt-multi-thread"] }

# serialization/deserialization-related crates (for JSON, CBOR and binary format)
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = {version = "1.0.149", default-features = false, features = ["alloc"] }

# logging support
log = "0.4.29"
log4rs = "1.4.0"

[patch.crates-io]
cms           = { git = "https://github.com/RustCrypto/formats.git" }
pkcs12     = { git = "https://github.com/RustCrypto/formats.git" }
